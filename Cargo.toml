[package]
name = "dash"
version = "0.1.0"
edition = "2024"

# not `dash`: macOS ships a shell by that name
[[bin]]
name = "hud"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
chrono = "0.4"
jiff = "0.2"
ratatui = "0.30"
rrule = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tachyonfx = "0.25.2"
